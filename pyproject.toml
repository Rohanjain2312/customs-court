[project]
name = "tariffagent"
version = "0.1.0"
description = "Customs Court: an agentic HTS classifier grounded in CBP CROSS rulings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Rohan Jain" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "numpy>=1.26",
  "anthropic>=0.70",
  "openai>=1.50",
  "mcp>=1.20",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "pypdf>=6.19.0",
  "beautifulsoup4>=4.15.0",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
cloud = ["anthropic[bedrock,vertex]>=1.9"]
# Customs Court demo server (demo/backend). SSE uses Starlette StreamingResponse, which ships with FastAPI.
demo = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
tariffagent = "tariffagent.cli:app"
tariffagent-mcp = "tariffagent.mcp_server.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariffagent"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: calls a paid API (run with -m live, capped at about $0.50 total)"]
addopts = "-m 'not live'"
